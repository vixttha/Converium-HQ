name: Historical benchmark task qualification
on:
  workflow_dispatch:
  push:
    branches: ['review/v0.1.0-baseline']
    paths: ['benchmarks/qualify.py', '.github/workflows/benchmark-qualification.yml']
  pull_request:
    branches: ['main']
    paths: ['benchmarks/qualify.py', '.github/workflows/benchmark-qualification.yml']
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'vixttha/Converium-HQ' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Reproduce two pinned defects with passing controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: python3 -B benchmarks/qualify.py
      - name: Check no HQ files changed
        run: test -z "$(git status --porcelain)"
